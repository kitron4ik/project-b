name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest build

      - name: Run tests
        run: pytest tests/ -v

      - name: Build package
        run: python -m build

      - name: Notify project-a about new version
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.PROJECT_A_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Секрет PROJECT_A_TOKEN не задан - уведомление проекта A пропущено"
          else
            curl -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/repos/kitron4ik/project-a/dispatches \
              -d '{"event_type":"update-submodule"}'
          fi
